version: 2

# tauri build fails unless the tauri crate and @tauri-apps/api share the same
# major/minor version, so update Tauri packages of both ecosystems in one PR
multi-ecosystem-groups:
  tauri:
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "07:00"
      timezone: "Asia/Tokyo"

updates:
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    patterns:
      - "tauri"
      - "tauri-*"
    multi-ecosystem-group: "tauri"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7

  - package-ecosystem: "npm"
    directory: "/"
    patterns:
      - "@tauri-apps/*"
    multi-ecosystem-group: "tauri"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
